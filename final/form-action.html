<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jinja City Guide - Form Submission</title>
  <meta name="description" content="Thank you for your inquiry. Your adventure planning request has been received.">
  <meta name="author" content="Hyeyendele Rashidi">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/index.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  
  <header class="page-header">
    <div class="header-top">
      <a href="index.html" class="brand-logo" aria-label="Jinja City Guide Home">
        <span class="logo-icon">🏙️</span>
        <span>Jinja City Guide</span>
      </a>
      <nav class="main-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="adventures.html">Adventures</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>
  
  <main id="main">
<section class="form-section form-section-wide">
       <h1 class="form-title">Thank You for Your Inquiry!</h1>
       <p class="form-intro">We've received your adventure planning request. Here are your submitted details:</p>
       
       <div class="submission-details">
         <h3>Submission Details</h3>
         <div id="form-data" class="details-grid"></div>
       </div>
       
       <div class="form-actions">
         <a href="adventures.html" class="submit-btn submit-btn-coral">View Adventures</a>
         <a href="contact.html" class="submit-btn submit-btn-teal">Make Another Inquiry</a>
       </div>
     </section>
  </main>
  
  <footer class="page-footer">
    <div class="footer-content">
      <div class="footer-section">
        <h3>Jinja City Guide</h3>
        <p>Jinja, Uganda</p>
      </div>
      <div class="footer-links">
        <a href="attributions.html">Attributions</a>
        <a href="https://youtu.be/your-video-here">Video Demo</a>
      </div>
    </div>
    <p id="modified" class="footer-modified"></p>
  </footer>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const formData = document.getElementById('form-data');
      
      const labels = {
        name: 'Full Name',
        email: 'Email Address',
        adventureType: 'Adventure Type',
        travelers: 'Number of Travelers',
        message: 'Special Requests'
      };
      
      const adventureLabels = {
        rafting: 'White Water Rafting',
        bungee: 'Bungee Jumping',
        quad: 'Quad Biking',
        cruise: 'Nile Cruise',
        kayak: 'Kayaking',
        other: 'Other Inquiry'
      };
      
      let html = '';
      for (const [key, value] of params) {
        if (key === 'adventureType' && value) {
          html += `<div class="detail-item"><span class="detail-label">${labels[key]}:</span> <span>${adventureLabels[value] || value}</span></div>`;
        } else {
          html += `<div class="detail-item"><span class="detail-label">${labels[key] || key}:</span> <span>${value || 'Not provided'}</span></div>`;
        }
      }
      
      formData.innerHTML = html || '<p>No data received. Please submit the form from the contact page.</p>';
      
      // Set last modified
      document.getElementById('modified').textContent = 'Last Modified: ' + new Date(document.lastModified).toLocaleDateString();
    });
  </script>
</body>
</html>
